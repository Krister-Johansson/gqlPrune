# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review settings for gqlPrune. docs/coderabbit.md explains what
# CodeRabbit checks here and how to work with its reviews.
#
# The review budget is the constraint that shapes this file: reviews are
# counted per rolling hour, so a PR gets one auto review when it opens and a
# re-check only on request ("@coderabbitai review").
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/reference/configuration

language: en-US
tone_instructions: >-
  Plain technical English. Name the rule, the file and the fix. No praise,
  no emojis, no em or en dashes.

reviews:
  profile: chill

  # The summary goes into the walkthrough comment, not the PR description,
  # which the author writes (Closes #N, how tested).
  high_level_summary: true
  high_level_summary_in_walkthrough: true

  # Skip messages ("review needs a manual trigger", "rate limited") stay on,
  # in the walkthrough comment, so the author sees why no review came.
  review_status: true
  # CodeRabbit's check run on the head commit shows the review in the merge
  # box. It is not a required status check, and a review error does not fail
  # it. commit_status mirrors progress only while review_progress is off.
  review_progress: true
  commit_status: false
  fail_commit_status: false

  in_progress_fortune: false
  poem: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    # One auto review when the PR opens. Pushes that address review comments
    # do not trigger a review. When the fixes are ready for a re-check,
    # request one by commenting "@coderabbitai review".
    auto_incremental_review: false
    # Machine-generated PRs with nothing meaningful to review.
    ignore_title_keywords:
      - 'chore(main): release'
    ignore_usernames:
      - 'dependabot[bot]'

  # CodeRabbit already skips lock files, dist, node_modules, binaries, images
  # and directories named generated by default.
  path_filters:
    - '!package-lock.json'
    - '!CHANGELOG.md'
    # Competitive research notes, read for context and not maintained as docs.
    - '!docs/research/**'

  path_instructions:
    - path: 'src/**'
      instructions: |
        gqlPrune is a schema-free CLI that reports unused GraphQL operations and fragments. Its output is a list of candidates, not proof; flag user-facing text that claims certainty.
        - Logic lives in small pure exported functions. mainFunction in src/core/gqlPruner.ts only wires them to the filesystem and the console. Flag logic added to mainFunction or cli.ts that a pure helper could hold.
        - In --json mode stdout carries only the JSON document. Info lines, warnings and GitHub annotations go to stderr; advisory warnings also go into the JSON warnings array. Flag any console.log on a path that runs in --json mode, other than the report itself.
        - Reporting paths set process.exitCode instead of calling process.exit, so buffered stdout flushes. Exit codes: 0 clean, 1 findings, 2 usage, config or unexpected errors.
        - GitHub annotations use the ::warning / ::error workflow-command format and escape their text with escapeAnnotationMessage.
        - Colour comes from kleur.
        - Intra-repo imports use explicit .js specifiers (module node16).
        - Each exported function has a short JSDoc block. Comments explain why, not what.
        - The package makes no network requests and reads no environment variable other than GITHUB_ACTIONS. Flag fetch, http or https clients, child_process, eval, new Function, createRequire and new process.env reads.
        - TypeScript runs in strict mode. Flag new uses of any, non-null assertions without a reason, and @ts-ignore.

    - path: 'test/**/*.test.ts'
      instructions: |
        Unit specs, one per source module. Tests come first: a behaviour change in src/ needs a test that fails without it.
        - One describe per function, small focused it blocks, explicit expected values.
        - mainFunction is driven through the partial-mock setup in test/gqlPruner.test.ts: real pure helpers, mocked filesystem.
        - Test names describe behaviour, not implementation.

    - path: 'test/e2e/**'
      instructions: |
        The e2e suite spawns the built CLI as a process. Assertions name section headers, finding names, parsed JSON keys and exit codes. Flag whole-output equality or snapshot assertions: they break on every added column. contract.e2e.test.ts is the one exception, because it pins the JSON key sets and the exit-code matrix on purpose.
        A fixture project that carries gqlPrune.config.yaml or a codegen config is run with cwd set to itself.

    - path: 'test/fixtures/**'
      instructions: |
        Input data for the e2e suite, never compiled or linted. Each fixture file says it is a fixture in a comment. Do not flag unresolved imports, unused code, codegen-shaped output or style in these files; they imitate a consumer's tree on purpose. Do flag a fixture file without the fixture comment.

    - path: 'docs/adr/**'
      instructions: |
        ADRs follow docs/adr/README.md. A new ADR has status proposed; flag a new ADR with status accepted, because only the maintainer accepts ADRs.

    - path: '**/*.md'
      instructions: |
        Plain technical prose. Flag em dashes and en dashes, Title Case headings (headings use sentence case), curly quotes, emojis in headings or bullets, and filler phrases. Docs describe the tool as it is, not as a diff. Findings are described as candidates from a static scan, not as proof that code is dead. CHANGELOG.md belongs to release-please: flag any hand edit to it.

    - path: '.github/workflows/**'
      instructions: |
        Every action is pinned by full commit SHA with a version comment. permissions are least privilege, set per job, with a read-only default at the top. No pull_request_target trigger. actions/checkout sets persist-credentials: false. Flag ${{ github.event.* }} values interpolated straight into run scripts. The job names "ci / build + test (node 20)", "ci / build + test (node 22)" and "ci / linked issue" are required checks; flag a rename.

    - path: 'package.json'
      instructions: |
        The version field belongs to release-please: flag a hand edit. files lists what is published; flag an entry that would ship tests, fixtures or scripts. A new runtime dependency needs a reason in the PR description.

    - path: '.coderabbit.yaml'
      instructions: |
        CodeRabbit reads this file from the PR's own branch, so a change here already applies to the review of this PR. Flag any change that drops a path instruction, excludes source or test files through path_filters, or turns on auto_incremental_review, and say so in the summary.

  finishing_touches:
    # Commits and stacked PRs from CodeRabbit would bypass the TDD flow in
    # CLAUDE.md. The author applies each accepted suggestion by hand.
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    # All checks warn and never block. CI and the branch ruleset are the gate.
    docstrings:
      mode: 'off'
    title:
      mode: warning
      requirements: >-
        The title is a Conventional Commit: type(scope): outcome, for example
        "feat(scan): follow re-exports through barrel files". release-please
        builds the changelog from feat, fix and perf, so their title is the
        release note line and describes what users get. A change with no
        user-visible outcome uses docs, chore, ci, test or refactor. A
        breaking change has ! before the colon.
    description:
      mode: 'off'
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Behaviour change has a test
        mode: warning
        instructions: >-
          Scope: changed files under src/, excluding src/types/*.d.ts. Fail if
          at least one file in scope changed and the PR adds or changes no
          file under test/. Pass otherwise, including when no file in scope
          changed. A pure refactor fails this check by design; the PR
          description then says why no test changed.

  tools:
    # ESLint is the project's linter (eslint.config.js, flat config).
    eslint:
      enabled: true
    biome:
      enabled: false
    oxc:
      enabled: false
    # The repository has its own prose rules (the path instruction for
    # Markdown above).
    languagetool:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true

chat:
  art: false
  # Reply only when mentioned with @coderabbitai. Chat has its own hourly
  # limit.
  auto_reply: false

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  # CLAUDE.md is read by default as a code guideline. CONTRIBUTING.md adds
  # the contributor-facing rules.
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md

# Issues are written by the maintainer with full briefs; CodeRabbit stays out
# of them.
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
