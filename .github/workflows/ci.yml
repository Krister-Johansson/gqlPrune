# CI for this repository: build, typecheck, lint, and the test suite with
# coverage thresholds on Node 20 and 22, plus the issue-link check.
#
# Owned here since #118 (previously a thin caller into the shared-configs
# reusable CI). The job names deliberately match the branch ruleset's required
# status-check contexts ("ci / build + test (node NN)", "ci / linked issue"),
# so the ruleset needs no change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token; no job here needs write access.
permissions:
  contents: read

jobs:
  build-test:
    name: ci / build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - name: Upload coverage to Codecov
        # First matrix entry only — one upload per commit is enough.
        if: strategy.job-index == 0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Best-effort: never fail CI on an upload hiccup.
          fail_ci_if_error: false

  # Every PR must track a GitHub issue (issue-first workflow). Machine PRs
  # (dependabot, release-please) are exempt. Skipped jobs count as passing
  # for the ruleset, so this is safe to require.
  require-issue-link:
    name: ci / linked issue
    if: >
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.title, 'chore(main): release')
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR closes an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +([a-z0-9._-]+/[a-z0-9._-]+)?#[0-9]+'; then
            echo "PR references an issue."
          else
            echo "::error::Every PR must track a GitHub issue. Add 'Closes #<issue-number>' to the PR description."
            exit 1
          fi
