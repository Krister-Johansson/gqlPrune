# CodeQL code scanning (advanced setup). It replaces GitHub's default setup,
# which cannot exclude paths: test/fixtures holds deliberately broken input
# data (a source file with a syntax error, imports that resolve to nothing)
# that default setup reported as extraction errors on every run. The config
# file lists what is skipped.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so new queries in a CodeQL release reach code that has not changed.
  schedule:
    - cron: '41 6 * * 3'

# Least-privilege by default; the analysis job elevates only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # the scan needs repo reads
      security-events: write # SARIF upload to code scanning
      actions: read # workflow run metadata for the upload
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Neither language needs a build: both are extracted from source.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
