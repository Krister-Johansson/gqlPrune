# Release automation: release-please (manifest mode) maintains the release PR
# from Conventional Commits; merging it creates the tag and GitHub release, and
# the publish job ships to npm through Trusted Publishing (OIDC, provenance
# automatic, no token).
#
# Owned here since #118 (previously a thin caller into shared-configs). The
# release-please step uses the RELEASE_PLEASE_TOKEN secret (a fine-grained PAT:
# contents + pull-requests, read/write, this repo only) with a GITHUB_TOKEN
# fallback. With the PAT, the events release-please creates are real user
# events, so CI runs on release PRs (no close/reopen needed) and
# release-published workflows (sbom.yml) fire.
#
# npm Trusted Publisher setup (already configured on npmjs.com):
#   Provider: GitHub Actions · Organization: Krister-Johansson
#   Repository: gqlPrune · Workflow filename: release-please.yml
name: release-please

on:
  push:
    branches: [main]
  # Manual re-publish of the current version on main — e.g. when an auto-publish
  # failed AFTER the GitHub release was created. Safe: npm publish fails
  # harmlessly if the version is already on the registry.
  workflow_dispatch:

# Least-privilege at the top level; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, and the GitHub release
      pull-requests: write # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }} # the commit the release is tagged at
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }} # JSON of the release PR, when there is one
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Manifest mode: release-please-config.json + .release-please-manifest.json.

  # Regenerates docs/changelog.mdx on the release PR branch each time
  # release-please creates or updates the PR. release-please writes
  # CHANGELOG.md there, and Docs7 builds only docs/, so the page is a generated
  # copy that must be in the release commit for docs-live to carry it. The
  # commit goes through the contents API with RELEASE_PLEASE_TOKEN, so CI runs
  # on it, and the sha check refuses to overwrite a page that changed since the
  # checkout. If this job does not run, test/changelogPage.test.ts fails the
  # release PR. Runs for two close pushes to main take turns: otherwise the
  # later one's sha check could fail after the earlier one wrote a page for an
  # older CHANGELOG.md. Each run checks out the branch head when it starts, so
  # the run that goes last writes the page for the newest changelog. There is
  # one release branch, so one fixed group covers it.
  changelog-page:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    concurrency:
      group: changelog-page
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the GITHUB_TOKEN fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Regenerate the changelog page
        id: page
        run: |
          set -euo pipefail
          echo "blob=$(git hash-object docs/changelog.mdx)" >> "$GITHUB_OUTPUT"
          node scripts/changelogPage.cjs
          if git diff --quiet -- docs/changelog.mdx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the page to the release PR branch
        if: ${{ steps.page.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          BLOB: ${{ steps.page.outputs.blob }}
        run: |
          set -euo pipefail
          gh api --method PUT --silent \
            "repos/${GITHUB_REPOSITORY}/contents/docs/changelog.mdx" \
            -f message="docs: regenerate the changelog page" \
            -f content="$(base64 -w0 docs/changelog.mdx)" \
            -f branch="$BRANCH" \
            -f sha="$BLOB"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds
      # Trusted Publishing requires npm >= 11.5.1. Recent Node 24.x bundles a
      # satisfying npm, so no self-install is needed (and none would be
      # hash-pinnable); assert the floor instead of assuming it.
      - name: Assert npm >= 11.5.1 (Trusted Publishing floor)
        run: |
          V="$(npm --version)"
          node -e "
            const need = [11, 5, 1];
            const got = process.argv[1].split('.').map(Number);
            const cmp = got[0] - need[0] || got[1] - need[1] || got[2] - need[2];
            if (cmp < 0) {
              console.error('npm ' + process.argv[1] + ' is below the Trusted Publishing floor 11.5.1');
              process.exit(1);
            }
          " "$V"
      - run: npm ci
      # Last gate before the registry: the e2e suite packs this exact tree with
      # `npm pack`, installs the tarball into a throwaway directory and runs the
      # installed binary. A broken bin mapping, a file missing from "files", or
      # a lost shebang gets through every other check and is unfixable once
      # published, since npm versions are immutable.
      - run: npm run test:e2e
      # prepublishOnly (build + tests) runs as the pre-publish gate.
      - run: npm publish --access public

  # Moves docs-live, the branch Docs7 builds the user docs from, to the commit
  # npm just shipped, so the hosted docs and the Context7 library describe the
  # published version and not unreleased work on main. It runs after publish:
  # if the registry upload fails, the docs stay on the previous release, and a
  # manual re-publish (workflow_dispatch) that succeeds moves them then. The
  # REST call with force=false refuses anything but a fast-forward, and needs
  # no checkout.
  docs-live:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the docs-live ref
    steps:
      - name: Fast-forward docs-live to the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$SHA" ]; then
            # A manual re-publish creates no release, so take the commit of the
            # release tag for the version on main, never main itself, which
            # can hold unreleased work.
            version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${GITHUB_SHA}" \
              --jq .content | base64 -d | jq -r '."."')"
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/gqlprune-v${version}" --jq .sha)"
          fi
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/docs-live" \
            -f sha="$SHA" -F force=false
      # Docs7 refreshes the library only when it builds, and it does not build
      # for every docs-live move (a move that changes nothing under docs/, for
      # one). Refresh here so the library always follows docs-live.
      - name: Refresh the Context7 library
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::error::CONTEXT7_API_KEY is not set; add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --silent --show-error --fail-with-body -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d '{"libraryName": "/krister-johansson/gqlprune"}'
