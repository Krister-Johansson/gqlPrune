# Builds the landing page in website/ and deploys it to GitHub Pages at
# https://krister-johansson.github.io/gqlPrune/. The site is a separate
# project with its own package.json and lockfile; this workflow never installs
# or builds the npm package, and its jobs are not required checks.
#
# A pull request that touches the site only builds it. A push to main and a
# manual run build and deploy. Deploying needs Settings > Pages > Source set
# to "GitHub Actions".
#
# Two jobs on purpose: the build runs npm ci, and dependency lifecycle scripts
# must never share a job with the Pages write permission or the OIDC token.
# The deploy job installs nothing.
name: website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Least-privilege by default; only the deploy job elevates.
permissions:
  contents: read

# Whole runs queue per ref. On main a newer run waits for the running one,
# build and deploy included, so an older build can never deploy over a newer
# one, and a deploy is never cancelled halfway. Of several waiting runs only
# the newest is kept. Pull request runs only build, so a newer push cancels
# the older one.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: website / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # The build output is published, so no cache feeds into it, as in
          # the npm publish job.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: website / deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # Pages checks the OIDC token's ref before it deploys
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
