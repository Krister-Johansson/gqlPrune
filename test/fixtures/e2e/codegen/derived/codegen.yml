# FIXTURE GraphQL Code Generator config. Nothing generates from it; it exists so
# the e2e suite can run gqlPrune in a project that configures gqlPrune nowhere
# and see the settings derived from here instead.
schema: ./schema.graphql
documents: ./src/**/*.gql
generates:
  ./src/generated/graphql.ts:
    plugins:
      - typescript-react-apollo
