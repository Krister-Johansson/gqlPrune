query GetViaBarrel { item(id: 2) { id } }
query GetViaRename { item(id: 3) { id } }
query GetViaDefault { item(id: 4) { id } }
query GetViaNamespace { item(id: 5) { id } }
query GetViaCycle { item(id: 6) { id } }
query GetViaProperty { item(id: 7) { id } }
query GetViaBroken { item(id: 8) { id } }
